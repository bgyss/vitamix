# Pytest Configuration for Blender Testing
# This configuration file sets up pytest for use with Blender's test suite.
# While the test suite currently uses unittest, this prepares for future pytest migration.

[pytest]
# Test discovery patterns
python_files = test_*.py bl_*.py
python_classes = Test*
python_functions = test_*

# Minimum Python version
minversion = 6.0

# Add current directory to Python path
pythonpath = . python python/modules

# Default test paths
testpaths = python

# Output options
addopts =
    # Verbose output
    -v
    # Show extra test summary info
    -ra
    # Strict markers - fail on unregistered markers
    --strict-markers
    # Show local variables in tracebacks
    --showlocals
    # Capture method: use sys for better Blender integration
    --capture=sys
    # Traceback style
    --tb=short

# Console output style
console_output_style = progress

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Test markers for categorization
# Usage: @pytest.mark.slow
markers =
    # Test execution speed
    slow: marks tests as slow (deselect with '-m "not slow"')
    fast: marks tests as fast unit tests

    # Resource requirements
    gpu: marks tests that require GPU
    cpu_only: marks tests that only run on CPU
    memory_intensive: marks tests that require significant memory

    # Test categories by function
    unit: unit tests for individual functions/methods
    integration: integration tests across components
    regression: regression tests for bug fixes
    smoke: critical smoke tests that should always pass

    # Subsystem markers
    bmesh: tests for BMesh subsystem
    render: rendering tests
    io: import/export tests
    animation: animation system tests
    modifiers: modifier tests
    nodes: node system tests
    physics: physics simulation tests
    sculpt: sculpting tests
    geometry: geometry processing tests
    ui: user interface tests

    # Platform/backend specific
    cycles: Cycles render engine tests
    eevee: EEVEE render engine tests
    workbench: Workbench render engine tests
    wayland: tests requiring Wayland

    # Special test types
    screenshot: tests that generate screenshots
    visual: tests requiring visual comparison
    performance: performance/benchmark tests
    skip_in_ci: skip these tests in CI environment
    flaky: known flaky tests that may need retry

    # Development/debugging
    wip: work in progress tests
    debug: debugging tests (not run by default)

# Timeout settings (requires pytest-timeout)
# timeout = 300
# timeout_method = signal

# Coverage options (requires pytest-cov)
# [coverage:run]
# source = .
# omit = tests/*, extern/*, build/*

# Warnings
filterwarnings =
    # Convert warnings to errors (strict mode)
    # error
    # Ignore specific warnings
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# xfail strict mode - xfail tests that pass will fail the test suite
# xfail_strict = true

# Require minimum of this test pass percentage
# required_plugins = pytest-xdist pytest-timeout pytest-rerunfailures
